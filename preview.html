<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>ROSS AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ROSS AI: informação jurídica, em linguagem simples. Entenda leis, contratos e documentos com clareza, com as fontes à vista.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="styles.css">
<div id="app" class="app">
  <a class="skip" href="#main">Pular para o conteúdo</a>
  <header class="topbar" id="topbar"></header>
  <nav id="drawer" class="drawer" aria-label="Menu" aria-hidden="true"></nav>
  <div id="scrim" class="scrim" hidden></div>
  <main id="main" class="main" tabindex="-1"></main>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <input type="file" id="file-input" accept=".pdf,image/jpeg,image/png,image/webp" multiple hidden>
</div>
<noscript><p style="padding:24px;font-family:sans-serif">O ROSS AI precisa de JavaScript para funcionar.</p></noscript>
<script src="i18n.js"></script>
<script src="demo-data.js"></script>
<script src="app.js"></script>
</body></html>
